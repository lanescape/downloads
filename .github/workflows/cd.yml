name: CD

# Every push to main is checked as a pull request is, then deployed: ko
# builds the service's image and pushes it to Artifact Registry, and
# Infrastructure Manager previews and applies infra/ from this repository at
# the commit, with the image's digest and the names of the secrets
# config/groups.yaml names. Once applied, a smoke check asks the deployed
# service for an absent object of every group (specs/0002-deployment.md, CI
# and CD).
#
# Nothing deploys until the maintainer has set the repository's variables
# below, after applying bootstrap/ (bootstrap/README.md, After the first
# apply): until then the deploy is skipped, with a notice saying which are
# missing, and only the checks run.
on:
  push:
    branches: [main]

permissions:
  contents: read

# One run at a time, each in its turn, in the order they began to wait,
# and none cancelled, waiting or running, so a rerun of an older run never
# displaces main's head's. A run's deploy goes ahead only if its commit is
# still main's head when its turn comes (the gate below), so an older
# commit never deploys over a newer one, and main's head always has a run
# of its own to deploy it.
concurrency:
  group: cd
  cancel-in-progress: false
  queue: max

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  gate:
    name: May deploy
    needs: checks
    runs-on: ${{ github.repository_owner_id == '303994381' && 'lanescape-2vcpu-linux-amd64' || 'ubuntu-26.04' }}
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - name: Check the repository, the variables and main's head
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          DOWNLOADS_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.DOWNLOADS_WORKLOAD_IDENTITY_PROVIDER }}
          DOWNLOADS_DEPLOYER: ${{ vars.DOWNLOADS_DEPLOYER }}
          DOWNLOADS_IMAGE_REPOSITORY: ${{ vars.DOWNLOADS_IMAGE_REPOSITORY }}
          DOWNLOADS_INFRA_MANAGER_BUCKET: ${{ vars.DOWNLOADS_INFRA_MANAGER_BUCKET }}
          DOWNLOADS_SERVICE_URL: ${{ vars.DOWNLOADS_SERVICE_URL }}
        run: |
          set -euo pipefail
          skip() {
            echo "::notice title=Deploy skipped::$1"
            echo "deploy=false" >>"$GITHUB_OUTPUT"
            exit 0
          }
          # This repository alone, by its ID and its owner's.
          if [ "$GITHUB_REPOSITORY_ID" != 1467557213 ] || [ "$GITHUB_REPOSITORY_OWNER_ID" != 303994381 ]; then
            skip "CD deploys only lanescape/downloads."
          fi
          # Each variable, and what a value must look like: bootstrap/'s
          # outputs, which name nothing but the service's own.
          declare -A pattern=(
            [DOWNLOADS_WORKLOAD_IDENTITY_PROVIDER]='^projects/[0-9]+/locations/global/workloadIdentityPools/lanescape-downloads-github/providers/github$'
            [DOWNLOADS_DEPLOYER]='^lanescape-downloads-deployer@lanescape-dev\.iam\.gserviceaccount\.com$'
            [DOWNLOADS_IMAGE_REPOSITORY]='^us-central1-docker\.pkg\.dev/lanescape-dev/lanescape-downloads$'
            [DOWNLOADS_INFRA_MANAGER_BUCKET]='^gs://lanescape-downloads-infra-manager$'
            [DOWNLOADS_SERVICE_URL]='^https://lanescape-downloads-[0-9]+\.us-central1\.run\.app$'
          )
          missing=() bad=()
          for name in DOWNLOADS_WORKLOAD_IDENTITY_PROVIDER DOWNLOADS_DEPLOYER DOWNLOADS_IMAGE_REPOSITORY DOWNLOADS_INFRA_MANAGER_BUCKET DOWNLOADS_SERVICE_URL; do
            value=${!name}
            if [ -z "$value" ]; then
              missing+=("$name")
            elif ! [[ $value =~ ${pattern[$name]} ]]; then
              bad+=("$name")
            fi
          done
          if [ ${#bad[@]} -gt 0 ]; then
            echo "::error title=CD's variables::${bad[*]} don't look like bootstrap/'s outputs: see bootstrap/README.md, After the first apply."
            exit 1
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            skip "The repository's variables ${missing[*]} aren't set yet. The maintainer sets them after applying bootstrap/ (bootstrap/README.md, After the first apply); until then nothing deploys."
          fi
          # An older commit never deploys over a newer one: main's head has
          # a run of its own, waiting behind this one, which deploys it.
          # curl and jq, which the runner service's machines have; not gh.
          head=$(printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" |
            curl -fsS -K - -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main" |
            jq -er .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            skip "main has moved on to $head since $GITHUB_SHA; the run for a later push deploys it."
          fi
          echo "deploy=true" >>"$GITHUB_OUTPUT"

  deploy:
    name: Deploy
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: lanescape-2vcpu-linux-amd64
    timeout-minutes: 30
    # Signing in to Google needs GitHub's token, which only a push to main
    # by this workflow's own jobs can use (bootstrap/cd.tf).
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: lanescape-dev
      REGION: us-central1
      DEPLOYMENT: projects/lanescape-dev/locations/us-central1/deployments/lanescape-downloads
      INFRA_ACCOUNT: projects/lanescape-dev/serviceAccounts/lanescape-downloads-infra@lanescape-dev.iam.gserviceaccount.com
      SOURCE: https://github.com/lanescape/downloads.git
      # The Terraform Infrastructure Manager runs infra/ with, which infra/
      # must work with (infra/README.md).
      TF_VERSION: 1.5.7
      IMAGE_REPOSITORY: ${{ vars.DOWNLOADS_IMAGE_REPOSITORY }}
      INFRA_MANAGER_BUCKET: ${{ vars.DOWNLOADS_INFRA_MANAGER_BUCKET }}
    steps:
      - uses: lanescape/runners/actions/checkout@v1
      # No cache: what's deployed is built from the commit and the module
      # proxy alone.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.DOWNLOADS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DOWNLOADS_DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Build and push the image
        id: image
        run: |
          set -euo pipefail
          # ko signs in to Artifact Registry with the credentials above. Each
          # push's tag is its own, of its commit, run and attempt; what's
          # deployed is the digest alone.
          ref=$(KO_DOCKER_REPO="$IMAGE_REPOSITORY/downloads" go run github.com/google/ko@v0.19.1 build ./cmd/downloads \
            --bare --sbom=none --tags="git-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")
          digest=${ref##*@}
          image="$IMAGE_REPOSITORY/downloads@$digest"
          if ! [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::ko gave $ref, not an image by digest"
            exit 1
          fi
          echo "image=$image" >>"$GITHUB_OUTPUT"
          echo "Image: \`$image\`" >>"$GITHUB_STEP_SUMMARY"
      - name: List the secrets the configuration names
        id: secrets
        run: |
          set -euo pipefail
          names=$(go run ./cmd/downloads -secret-names)
          echo "names=$names" >>"$GITHUB_OUTPUT"
          echo "Secrets: \`$names\`" >>"$GITHUB_STEP_SUMMARY"
      # apply.sh asks again whether the commit is main's head, at every
      # attempt, since a rerun of this job alone keeps the gate's answer.
      - name: Preview and apply infra/
        id: apply
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SECRET_NAMES: ${{ steps.secrets.outputs.names }}
          GH_TOKEN: ${{ github.token }}
        run: bash cd/apply.sh
      - name: Smoke check
        if: steps.apply.outputs.deployed == 'true'
        env:
          SERVICE_URL: ${{ vars.DOWNLOADS_SERVICE_URL }}
        run: go run ./cmd/downloads -smoke-check "$SERVICE_URL"
